<!doctype html>
<!--
  Source for public/og.png (1200×630 share image). Regenerate with:
  npm run og
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'JBMono';
        src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }
      :root {
        --bg: #0a0b0d;
        --surface: #111317;
        --ink: #edeef0;
        --muted: #9aa1ac;
        --faint: #828995;
        --accent: #ffb224;
        --line: rgb(148 163 184 / 0.14);
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px;
        color: var(--ink);
        background:
          radial-gradient(520px 420px at 92% 0%, rgb(255 178 36 / 0.16), transparent 70%),
          linear-gradient(to right, rgb(148 163 184 / 0.08) 1px, transparent 1px) 0 0 / 160px 160px,
          linear-gradient(to bottom, rgb(148 163 184 / 0.08) 1px, transparent 1px) 0 0 / 160px 160px,
          linear-gradient(to right, rgb(148 163 184 / 0.04) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(to bottom, rgb(148 163 184 / 0.04) 1px, transparent 1px) 0 0 / 32px 32px,
          var(--bg);
      }
      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid var(--line);
      }
      .mono {
        font-family: 'JBMono', monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        position: relative;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border: 1px solid rgb(148 163 184 / 0.3);
        font-family: 'Bricolage';
        font-weight: 700;
        font-size: 21px;
      }
      .logo::after {
        content: '';
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 8px;
        height: 8px;
        background: var(--accent);
      }
      h1 {
        margin-top: 70px;
        font-family: 'Bricolage';
        font-weight: 600;
        font-size: 132px;
        line-height: 0.88;
        letter-spacing: -0.045em;
      }
      h1 span {
        color: var(--accent);
      }
      .dim {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 620px;
        margin-top: 30px;
        color: var(--faint);
      }
      .dim i {
        display: block;
        height: 1px;
        flex: 1;
        background: currentColor;
        opacity: 0.6;
      }
      .dim b {
        display: block;
        width: 1px;
        height: 14px;
        background: currentColor;
      }
      .role {
        margin-top: 26px;
        font-family: 'JBMono', monospace;
        font-size: 26px;
        color: var(--muted);
      }
      .role em {
        font-style: normal;
        color: var(--accent);
      }
      svg {
        position: absolute;
        right: 64px;
        top: 150px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"></div>
      <div class="top">
        <div class="logo">MI</div>
        <div class="mono">Freelance · Available for projects</div>
      </div>
      <h1>Mehtab<br />Ismail<span>.</span></h1>
      <div class="dim mono"><b></b><i></i>idea → architecture → pixel<i></i><b></b></div>
      <p class="role">role: <em>Full-Stack Developer · System Architect</em></p>

      <svg width="330" height="380" viewBox="0 0 330 380" fill="none">
        <g stroke="rgb(148 163 184 / 0.5)" stroke-width="1.5">
          <path d="M165 66 V128" />
          <path d="M165 176 C165 210 70 210 70 244" />
          <path d="M165 176 C165 210 260 210 260 244" />
          <path d="M260 292 V318" />
        </g>
        <g font-family="JBMono" font-size="15">
          <rect
            x="105"
            y="20"
            width="120"
            height="46"
            rx="6"
            fill="#111317"
            stroke="rgb(148 163 184 / 0.4)"
          />
          <text x="165" y="48" fill="#edeef0" text-anchor="middle">Client</text>
          <circle cx="165" cy="152" r="60" fill="rgb(255 178 36 / 0.12)" />
          <rect x="105" y="128" width="120" height="48" rx="6" fill="#111317" stroke="#ffb224" />
          <text x="165" y="157" fill="#ffb224" text-anchor="middle">API</text>
          <rect
            x="10"
            y="244"
            width="120"
            height="48"
            rx="6"
            fill="#111317"
            stroke="rgb(148 163 184 / 0.4)"
          />
          <text x="70" y="273" fill="#edeef0" text-anchor="middle">Database</text>
          <rect
            x="200"
            y="244"
            width="120"
            height="48"
            rx="6"
            fill="#111317"
            stroke="rgb(148 163 184 / 0.4)"
          />
          <text x="260" y="273" fill="#edeef0" text-anchor="middle">Queue</text>
          <rect
            x="200"
            y="318"
            width="120"
            height="48"
            rx="6"
            fill="#111317"
            stroke="rgb(148 163 184 / 0.4)"
          />
          <text x="260" y="347" fill="#edeef0" text-anchor="middle">Worker</text>
          <circle cx="165" cy="100" r="5" fill="#ffb224" />
        </g>
      </svg>
    </div>
  </body>
</html>
